<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ventas - Expendio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="fa-solid fa-martini-glass-citrus me-2"></i>Expendio de Bebidas</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="sucursales.html">Sucursales</a></li>
          <li class="nav-item"><a class="nav-link" href="empleados.html">Empleados</a></li>
          <li class="nav-item"><a class="nav-link" href="clientes.html">Clientes</a></li>
          <li class="nav-item"><a class="nav-link" href="proveedores.html">Proveedores</a></li>
          <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link active" href="ventas.html">Ventas</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mb-5">
    <div class="page-header">
      <h1><i class="fa-solid fa-cash-register me-3"></i>Gestión de Ventas</h1>
      <a href="index.html" class="btn btn-outline-light"><i class="fa-solid fa-arrow-left me-2"></i>Volver al Inicio</a>
    </div>

    <div class="card p-4 shadow-sm mb-4">
      <form id="formventas">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h5 id="formTitle" class="m-0"><i class="fa-solid fa-plus-circle me-2"></i>Nueva Venta</h5>
          <div>
            <span class="badge bg-primary fs-6" id="folioDisplay">Folio: Generando...</span>
          </div>
        </div>
        
        <input type="hidden" id="id">
        <input type="hidden" id="folio">
        
        <!-- Bloque 1: Entidades -->
        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <label class="form-label text-muted small mb-1">Sucursal</label>
            <select id="sucursal_id" class="form-select" required>
              <option value="">Cargando sucursales...</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label text-muted small mb-1">Empleado</label>
            <select id="empleado_id" class="form-select" required>
              <option value="">Cargando empleados...</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label text-muted small mb-1">Cliente</label>
            <select id="cliente_id" class="form-select" required>
              <option value="">Cargando clientes...</option>
            </select>
          </div>
        </div>

        <!-- Bloque 2: Detalles de pago -->
        <div class="row g-3 mb-4 p-3 bg-light rounded-3 border">
          <div class="col-md-3">
            <label class="form-label text-muted small mb-1">Fecha de Venta</label>
            <input type="date" id="fecha_venta" class="form-control bg-white" required>
          </div>
          <div class="col-md-3">
            <label class="form-label text-muted small mb-1">Método de Pago</label>
            <select id="metodo_pago" class="form-select bg-white" required>
              <option value="Efectivo">Efectivo</option>
              <option value="Tarjeta crédito">Tarjeta de Crédito</option>
              <option value="Tarjeta débito">Tarjeta de Débito</option>
              <option value="Transferencia">Transferencia</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label text-muted small mb-1">Estatus</label>
            <select id="estatus" class="form-select bg-white" required>
              <option value="Pagada">Pagada</option>
              <option value="En proceso">En proceso</option>
              <option value="Entregada">Entregada</option>
              <option value="Cancelada">Cancelada</option>
            </select>
          </div>
        </div>

        <!-- Bloque 3: Montos -->
        <h6 class="mb-3 text-muted border-bottom pb-2">Desglose de Montos</h6>
        <div class="row g-3">
          <div class="col-md-3">
            <label class="form-label text-muted small mb-1">Subtotal ($)</label>
            <input type="number" step="0.01" id="subtotal" class="form-control" placeholder="0.00" required>
          </div>
          <div class="col-md-3">
            <label class="form-label text-muted small mb-1">Descuento ($)</label>
            <input type="number" step="0.01" id="descuento" class="form-control" placeholder="0.00" required>
          </div>
          <div class="col-md-3">
            <label class="form-label text-muted small mb-1">Impuesto (16%) ($)</label>
            <input type="number" step="0.01" id="impuesto" class="form-control bg-light" readonly placeholder="0.00" required>
          </div>
          <div class="col-md-3">
            <label class="form-label text-muted small mb-1 fw-bold">Total a Pagar ($)</label>
            <input type="number" step="0.01" id="total" class="form-control border-primary text-primary fw-bold bg-light" readonly placeholder="0.00" required>
          </div>
        </div>
        
        <div class="mt-4 text-end">
          <button type="button" class="btn btn-outline-secondary me-2 d-none" id="btnCancel">
            <i class="fa-solid fa-xmark me-1"></i> Cancelar
          </button>
          <button type="submit" class="btn btn-primary" id="btnSave">
            <i class="fa-solid fa-check me-1"></i> Confirmar Venta
          </button>
        </div>
      </form>
    </div>

    <div class="table-responsive">
      <table class="table table-hover table-striped">
        <thead class="table-dark">
          <tr>
            <th>Folio</th>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Sucursal</th>
            <th>Total</th>
            <th>Estatus</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/ventas.js"></script>
</body>
</html>
