<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empleados - Expendio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="fa-solid fa-martini-glass-citrus me-2"></i>Expendio de Bebidas</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="sucursales.html">Sucursales</a></li>
          <li class="nav-item"><a class="nav-link active" href="empleados.html">Empleados</a></li>
          <li class="nav-item"><a class="nav-link" href="clientes.html">Clientes</a></li>
          <li class="nav-item"><a class="nav-link" href="proveedores.html">Proveedores</a></li>
          <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="ventas.html">Ventas</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mb-5">
    <div class="page-header">
      <h1><i class="fa-solid fa-users-gear me-3"></i>Gestión de Empleados</h1>
      <a href="index.html" class="btn btn-outline-light"><i class="fa-solid fa-arrow-left me-2"></i>Volver al Inicio</a>
    </div>

    <div class="card p-4 shadow-sm mb-4">
      <form id="formempleados">
        <h5 id="formTitle" class="mb-4"><i class="fa-solid fa-plus-circle me-2"></i>Agregar Empleado</h5>
        
        <!-- Hidden ID -->
        <input type="hidden" id="id">
        
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label text-muted small mb-1">Nombre(s)</label>
            <input type="text" id="nombre" class="form-control" placeholder="Nombre" required>
          </div>
          <div class="col-md-4">
            <label class="form-label text-muted small mb-1">Apellido Paterno</label>
            <input type="text" id="apellido_paterno" class="form-control" placeholder="Paterno" required>
          </div>
          <div class="col-md-4">
            <label class="form-label text-muted small mb-1">Apellido Materno</label>
            <input type="text" id="apellido_materno" class="form-control" placeholder="Materno" required>
          </div>
          <div class="col-md-4">
            <label class="form-label text-muted small mb-1">Sucursal Asignada</label>
            <select id="sucursal_id" class="form-select" required>
              <option value="">Cargando sucursales...</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label text-muted small mb-1">Puesto</label>
            <select id="puesto" class="form-select" required>
              <option value="Vendedor">Vendedor</option>
              <option value="Cajero">Cajero</option>
              <option value="Almacén">Almacén</option>
              <option value="Gerente">Gerente</option>
              <option value="Supervisor">Supervisor</option>
              <option value="Auxiliar">Auxiliar</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label text-muted small mb-1">Teléfono</label>
            <input type="text" id="telefono" class="form-control" placeholder="10 dígitos" required>
          </div>
          <div class="col-md-4">
            <label class="form-label text-muted small mb-1">Correo Electrónico</label>
            <input type="email" id="email" class="form-control" placeholder="correo@ejemplo.com" required>
          </div>
          <div class="col-md-2">
            <label class="form-label text-muted small mb-1">Fecha Ingreso</label>
            <input type="date" id="fecha_ingreso" class="form-control" required>
          </div>
          <div class="col-md-2">
            <label class="form-label text-muted small mb-1">Salario ($)</label>
            <input type="number" step="0.01" id="salario" class="form-control" placeholder="0.00" required>
          </div>
          <div class="col-md-2">
            <label class="form-label text-muted small mb-1">Turno</label>
            <select id="turno" class="form-select" required>
              <option value="Matutino">Matutino</option>
              <option value="Vespertino">Vespertino</option>
              <option value="Mixto">Mixto</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label text-muted small mb-1">Estatus</label>
            <select id="estatus" class="form-select" required>
              <option value="Activo">Activo</option>
              <option value="Baja">Baja</option>
            </select>
          </div>
        </div>
        
        <div class="mt-4 text-end">
          <button type="button" class="btn btn-outline-secondary me-2 d-none" id="btnCancel">
            <i class="fa-solid fa-xmark me-1"></i> Cancelar
          </button>
          <button type="submit" class="btn btn-primary" id="btnSave">
            <i class="fa-solid fa-save me-1"></i> Guardar
          </button>
        </div>
      </form>
    </div>

    <div class="table-responsive">
      <table class="table table-hover table-striped">
        <thead class="table-dark">
          <tr>
            <th>Nombre Completo</th>
            <th>Sucursal</th>
            <th>Puesto</th>
            <th>Turno</th>
            <th>Salario</th>
            <th>Estatus</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/empleados.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
