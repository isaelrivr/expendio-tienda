<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos - Expendio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="fa-solid fa-martini-glass-citrus me-2"></i>Expendio de Bebidas</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="sucursales.html">Sucursales</a></li>
          <li class="nav-item"><a class="nav-link" href="empleados.html">Empleados</a></li>
          <li class="nav-item"><a class="nav-link" href="clientes.html">Clientes</a></li>
          <li class="nav-item"><a class="nav-link" href="proveedores.html">Proveedores</a></li>
          <li class="nav-item"><a class="nav-link active" href="productos.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="ventas.html">Ventas</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mb-5">
    <div class="page-header">
      <h1><i class="fa-solid fa-bottle-water me-3"></i>Gestión de Productos</h1>
      <a href="index.html" class="btn btn-outline-light"><i class="fa-solid fa-arrow-left me-2"></i>Volver al Inicio</a>
    </div>

    <div class="card p-4 shadow-sm mb-4">
      <form id="formproductos">
        <h5 id="formTitle" class="mb-4"><i class="fa-solid fa-plus-circle me-2"></i>Agregar Producto</h5>
        
        <input type="hidden" id="id">
        
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label text-muted small mb-1">Nombre del Producto</label>
            <input type="text" id="nombre" class="form-control" placeholder="Ej. Refresco Cola 600ml" required>
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted small mb-1">Código de Barras</label>
            <input type="text" id="codigo_barras" class="form-control" placeholder="0000000000000" required>
          </div>
          <div class="col-md-4">
            <label class="form-label text-muted small mb-1">Proveedor</label>
            <select id="proveedor_id" class="form-select" required>
              <option value="">Cargando proveedores...</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label text-muted small mb-1">Categoría</label>
            <select id="categoria" class="form-select" required>
              <option value="Refrescos">Refrescos</option>
              <option value="Jugos">Jugos</option>
              <option value="Aguas">Aguas</option>
              <option value="Cerveza sin alcohol">Cerveza sin alcohol</option>
              <option value="Energéticas">Energéticas</option>
              <option value="Botanas">Botanas</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label text-muted small mb-1">Marca</label>
            <input type="text" id="marca" class="form-control" placeholder="Marca" required>
          </div>
          <div class="col-md-12">
            <label class="form-label text-muted small mb-1">Descripción</label>
            <input type="text" id="descripcion" class="form-control" placeholder="Descripción breve" required>
          </div>
          <div class="col-md-2">
            <label class="form-label text-muted small mb-1">Unidad Medida</label>
            <select id="unidad_medida" class="form-select" required>
              <option value="botella">Botella</option>
              <option value="lata">Lata</option>
              <option value="paquete">Paquete</option>
              <option value="pieza">Pieza</option>
              <option value="bolsa">Bolsa</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label text-muted small mb-1">Costo ($)</label>
            <input type="number" step="0.01" id="costo" class="form-control" placeholder="0.00" required>
          </div>
          <div class="col-md-2">
            <label class="form-label text-muted small mb-1">Precio ($)</label>
            <input type="number" step="0.01" id="precio" class="form-control" placeholder="0.00" required>
          </div>
          <div class="col-md-2">
            <label class="form-label text-muted small mb-1">Stock</label>
            <input type="number" id="stock" class="form-control" placeholder="0" required>
          </div>
          <div class="col-md-2">
            <label class="form-label text-muted small mb-1">Stock Mínimo</label>
            <input type="number" id="stock_minimo" class="form-control" placeholder="0" required>
          </div>
          <div class="col-md-2">
            <label class="form-label text-muted small mb-1">Estatus</label>
            <select id="activo" class="form-select" required>
              <option value="1">Activo</option>
              <option value="0">Inactivo</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label text-muted small mb-1">Fecha de Caducidad</label>
            <input type="date" id="fecha_caducidad" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted small mb-1">Imagen del Producto</label>
            <div class="input-group">
              <input type="file" id="foto_file" class="form-control" accept="image/*">
              <input type="hidden" id="imagen"> <!-- Guarda la URL actual -->
            </div>
            <div id="image-preview-container" class="mt-2 d-none">
              <img id="image-preview" src="" alt="Preview" style="max-height: 100px; border-radius: 8px; border: 1px solid #444;">
              <small class="text-muted d-block mt-1">Vista previa</small>
            </div>
          </div>
        </div>
        
        <div class="mt-4 text-end">
          <button type="button" class="btn btn-outline-secondary me-2 d-none" id="btnCancel">
            <i class="fa-solid fa-xmark me-1"></i> Cancelar
          </button>
          <button type="submit" class="btn btn-primary" id="btnSave">
            <i class="fa-solid fa-save me-1"></i> Guardar
          </button>
        </div>
      </form>
    </div>

    <div class="table-responsive">
      <table class="table table-hover table-striped">
        <thead class="table-dark">
          <tr>
            <th>Producto</th>
            <th>Proveedor</th>
            <th>Categoría</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Estatus</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/productos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
