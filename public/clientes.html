</head>

    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="fa-solid fa-martini-glass-citrus me-2"></i>Expendio de Bebidas</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">

        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="sucursales.html">Sucursales</a></li>

          <li class="nav-item"><a class="nav-link" href="ventas.html">Ventas</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mb-5">
    <div class="page-header">
      <h1><i class="fa-solid fa-users me-3"></i>Gestión de Clientes</h1>
      <a href="index.html" class="btn btn-outline-light"><i class="fa-solid fa-arrow-left me-2"></i>Volver al Inicio</a>
    </div>

    <div class="card p-4 shadow-sm mb-4">
      <form id="formclientes">
        <h5 id="formTitle" class="mb-4"><i class="fa-solid fa-plus-circle me-2"></i>Agregar Cliente</h5>
        
        <input type="hidden" id="id">
        
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label text-muted small mb-1">Nombre(s)</label>
            <input type="text" id="nombre" class="form-control" placeholder="Nombre" required>
          </div>
          <div class="col-md-4">
            <label class="form-label text-muted small mb-1">Apellido Paterno</label>
            <input type="text" id="apellido_paterno" class="form-control" placeholder="Paterno" required>
          </div>
          <div class="col-md-4">
            <label class="form-label text-muted small mb-1">Apellido Materno</label>
            <input type="text" id="apellido_materno" class="form-control" placeholder="Materno" required>
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted small mb-1">Teléfono</label>
            <input type="text" id="telefono" class="form-control" placeholder="10 dígitos" required>
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted small mb-1">Correo Electrónico</label>
            <input type="email" id="email" class="form-control" placeholder="correo@ejemplo.com" required>
          </div>
          <div class="col-md-6">
            <label class="form-label text-muted small mb-1">Calle</label>
            <input type="text" id="calle" class="form-control" placeholder="Calle" required>
          </div>
          <div class="col-md-2">
            <label class="form-label text-muted small mb-1">Número</label>
            <input type="text" id="numero" class="form-control" placeholder="No." required>
          </div>
          <div class="col-md-4">
            <label class="form-label text-muted small mb-1">Colonia</label>
            <input type="text" id="colonia" class="form-control" placeholder="Colonia" required>
          </div>
          <div class="col-md-4">
            <label class="form-label text-muted small mb-1">Ciudad</label>
            <input type="text" id="ciudad" class="form-control" placeholder="Ciudad" required>
          </div>
          <div class="col-md-4">
            <label class="form-label text-muted small mb-1">Fecha Registro</label>
            <input type="date" id="fecha_registro" class="form-control" required>
          </div>
          <div class="col-md-4">
            <label class="form-label text-muted small mb-1">Puntos de Lealtad</label>
            <input type="number" id="puntos" class="form-control" placeholder="0" required>
          </div>
        </div>
        
        <div class="mt-4 text-end">
          <button type="button" class="btn btn-outline-secondary me-2 d-none" id="btnCancel">
            <i class="fa-solid fa-xmark me-1"></i> Cancelar
          </button>
          <button type="submit" class="btn btn-primary" id="btnSave">
            <i class="fa-solid fa-save me-1"></i> Guardar
          </button>
        </div>
      </form>
    </div>

    <div class="table-responsive">
      <table class="table table-hover table-striped">
        <thead class="table-dark">
          <tr>
            <th>Nombre Completo</th>
            <th>Teléfono</th>
            <th>Email</th>
            <th>Ciudad</th>
            <th>Puntos</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/clientes.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
